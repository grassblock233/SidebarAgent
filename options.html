<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SidebarAgent 设置</title>
    <link rel="icon" href="assets/icon-32.png">
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings-page">
      <header class="settings-header">
        <span class="brand-mark" aria-hidden="true">A</span>
        <div>
          <h1>SidebarAgent</h1>
          <p>设置</p>
        </div>
      </header>

      <section class="settings-section" aria-labelledby="apiHeading">
        <div class="section-heading">
          <h2 id="apiHeading">DeepSeek API</h2>
        </div>

        <form id="settingsForm">
          <label for="apiKey">API Key</label>
          <div class="key-field">
            <input id="apiKey" name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
            <button id="toggleVisibility" class="icon-button" type="button" title="显示 API Key" aria-label="显示 API Key">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-note">密钥保存在此浏览器的插件本地存储中。</p>

          <div class="model-field">
            <label for="modelSelect">模型</label>
            <select id="modelSelect" disabled>
              <option value="">请先获取模型列表</option>
            </select>
            <p id="modelMeta" class="field-note"></p>
          </div>

          <div class="form-actions">
            <button id="fetchModelsButton" class="secondary-button" type="button">连接并获取模型</button>
            <button id="saveButton" class="primary-button" type="submit" disabled>保存配置</button>
            <button id="clearKeyButton" class="danger-button" type="button">清除密钥</button>
          </div>
          <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="settings-section compact" aria-labelledby="privacyHeading">
        <h2 id="privacyHeading">数据</h2>
        <dl>
          <div><dt>发送至 DeepSeek</dt><dd>选中文字、网页标题、网址和对话内容</dd></div>
          <div><dt>本地保存</dt><dd>API Key 与当前浏览器会话</dd></div>
          <div><dt>其他服务</dt><dd>不发送</dd></div>
        </dl>
      </section>

      <a class="external-link" href="https://platform.deepseek.com/api_keys" target="_blank" rel="noreferrer">管理 DeepSeek API Key</a>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
