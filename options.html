<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SidebarAgent 设置</title>
    <link rel="icon" href="assets/icon-32.png">
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings-page">
      <!-- Product identity -->
      <header class="settings-header">
        <img class="brand-mark" src="assets/icon-48.png" alt="">
        <div><h1>SidebarAgent</h1><p>AI 提供商与模型</p></div>
      </header>

      <!-- Provider selection is separate from the selected provider's draft. -->
      <section class="settings-section" aria-labelledby="providerHeading">
        <div class="section-heading provider-heading-row">
          <h2 id="providerHeading">AI 提供商</h2>
          <span id="activeProviderBadge" class="active-badge" hidden>当前使用</span>
        </div>

        <div class="provider-picker">
          <select id="providerSelect" aria-label="选择提供商"></select>
          <button id="deleteCustomButton" class="danger-button compact-button" type="button" hidden>删除</button>
        </div>
        <p id="providerEndpoint" class="endpoint-text"></p>
      </section>

      <!-- Credentials and models are persisted only through the form actions. -->
      <section class="settings-section" aria-labelledby="configurationHeading">
        <div class="section-heading configuration-heading">
          <h2 id="configurationHeading">API 配置</h2>
          <p>当前提供商的访问凭据与模型</p>
        </div>
        <form id="settingsForm">
          <div id="customFields" class="field-group custom-fields" hidden>
            <div class="field-group-heading">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>
              <div><h3>兼容接口</h3><p>OpenAI Chat Completions 兼容地址</p></div>
            </div>
            <div class="field-stack">
              <label for="customName">提供商名称</label>
              <input id="customName" class="text-input" type="text" maxlength="60" placeholder="我的兼容接口">

              <label for="baseUrl">Base URL</label>
              <input id="baseUrl" class="text-input code-input" type="url" spellcheck="false" placeholder="https://example.com/v1">

              <div class="path-grid">
                <div><label for="modelsPath">Models Path</label><input id="modelsPath" class="text-input code-input" type="text" spellcheck="false" placeholder="/models"></div>
                <div><label for="chatPath">Chat Path</label><input id="chatPath" class="text-input code-input" type="text" spellcheck="false" placeholder="/chat/completions"></div>
              </div>

              <label class="checkbox-row" for="supportsModelDiscovery">
                <input id="supportsModelDiscovery" type="checkbox" checked>
                <span>接口支持获取模型列表</span>
              </label>
            </div>
          </div>

          <div class="field-group">
            <div class="field-group-heading">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8m-3 3 2 2m-5 1 2 2"/></svg>
              <div><h3>访问凭据</h3><p>密钥仅保存在当前浏览器</p></div>
            </div>
            <div class="field-stack">
              <label for="apiKey">API Key</label>
              <div class="key-field">
                <input id="apiKey" name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="输入 API Key">
                <button id="toggleVisibility" class="icon-button" type="button" title="显示 API Key" aria-label="显示 API Key">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p class="field-note">密钥仅保存在此浏览器的插件本地存储中。</p>
            </div>
          </div>

          <div class="field-group">
            <div class="field-group-heading">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M7 4v6m10 4v6m-13-3h16"/></svg>
              <div><h3>模型</h3><p>侧边栏请求使用的模型</p></div>
            </div>
            <div class="field-stack">
              <div class="model-heading-row">
                <span class="model-field-label">当前选择</span>
                <label class="checkbox-row inline-toggle" for="manualModelToggle">
                  <input id="manualModelToggle" type="checkbox">
                  <span>手动输入</span>
                </label>
              </div>
              <div class="model-control-row">
                <div id="modelPickerControl" class="model-select-control">
                  <span class="model-status-dot" aria-hidden="true"></span>
                  <button id="modelPickerButton" class="model-picker-button" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>
                    <span id="modelPickerProvider" class="model-picker-provider">AI</span>
                    <span id="modelPickerLabel" class="model-picker-label">请先获取模型列表</span>
                  </button>
                  <div id="modelPickerMenu" class="model-picker-menu" role="listbox" aria-label="可用模型" hidden></div>
                  <select id="modelSelect" class="model-select-native" aria-label="选择当前模型" disabled>
                    <option value="">请先获取模型列表</option>
                  </select>
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
                </div>
                <button id="fetchModelsButton" class="secondary-button" type="button">连接并获取模型</button>
              </div>
              <input id="manualModelInput" class="text-input code-input" type="text" spellcheck="false" placeholder="模型 ID 或推理接入点 ID" hidden>
              <p id="modelMeta" class="field-note"></p>
            </div>
          </div>

          <div class="form-actions">
            <div class="commit-actions">
              <button id="saveButton" class="primary-button" type="submit" disabled>保存配置</button>
              <button id="activateButton" class="secondary-button" type="button" disabled>设为当前</button>
            </div>
            <button id="clearProviderButton" class="danger-button" type="button">清除配置</button>
          </div>
          <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <footer class="project-footer">
        <a class="project-link" href="https://github.com/olu-py/SidebarAgent" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.4 4 5 5 0 0 0 19.3.5S18.1.1 15 1.8a13.4 13.4 0 0 0-7 0C4.9.1 3.7.5 3.7.5A5 5 0 0 0 3.6 4a5.4 5.4 0 0 0-1.4 3.7c0 5.4 3.5 6.5 6.8 7A4.8 4.8 0 0 0 8 18v4"/><path d="M8 19c-3 .9-3-2.5-4-3"/></svg>
          <span>SidebarAgent</span>
        </a>
      </footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
