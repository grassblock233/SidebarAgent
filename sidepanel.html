<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SidebarAgent</title>
    <link rel="icon" href="assets/icon-32.png">
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <div class="app-shell">
      <!-- Fixed product header and page-level actions -->
      <header class="workspace-header">
        <div class="product-mark" aria-label="SidebarAgent">
          <img src="assets/icon-32.png" alt="">
          <span>SidebarAgent</span>
        </div>
        <nav class="header-tools" aria-label="页面工具">
          <button id="captureViewportButton" class="icon-button" type="button" title="读取当前页面" aria-label="读取当前页面">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h8M8 12h8M8 15h5"/></svg>
          </button>
          <button id="clearButton" class="icon-button" type="button" title="清空对话" aria-label="清空对话">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>
          </button>
          <button id="settingsButton" class="icon-button" type="button" title="打开设置" aria-label="打开设置">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34A1.7 1.7 0 0 0 14 20.93V21h-4v-.08A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34L7 19.8l-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88L4.2 7.06 7.03 4.2l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.52V3h4v.08A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.52 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          </button>
        </nav>
      </header>

      <!-- Configuration state -->
      <div id="setupNotice" class="setup-notice" hidden>
        <div class="notice-copy">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>
          <span id="setupNoticeText">尚未配置 AI 提供商</span>
        </div>
        <button id="setupButton" type="button">前往设置</button>
      </div>

      <!-- Current page context; expansion overlays the conversation below. -->
      <div id="sourceDock" class="source-dock" hidden>
        <section id="sourcePanel" class="source-panel" aria-label="当前网页上下文">
          <div class="source-heading-row">
            <div class="source-identity">
              <span class="source-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7 10h4v8H5v-6a6 6 0 0 1 6-6M16 10h4v8h-6v-6a6 6 0 0 1 6-6"/></svg>
              </span>
              <div class="source-heading-copy">
                <span id="sourceLabel" class="source-kicker">选中文本</span>
                <span id="sourceMeta" class="source-meta"></span>
              </div>
            </div>
            <button id="toggleSourceButton" class="source-toggle-button" type="button" aria-controls="sourceText" aria-expanded="false" hidden>
              <span class="toggle-label">展开</span>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
            </button>
          </div>
          <div class="source-origin">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            <a id="sourceLink" href="#" target="_blank" rel="noreferrer"></a>
          </div>
          <div id="sourcePreviewRow" class="source-preview-row">
            <p id="sourceText" class="source-text"></p>
          </div>
          <p id="truncatedNotice" class="truncated-notice" hidden></p>
        </section>
      </div>

      <!-- Context-aware prompt shortcuts -->
      <section id="quickActions" class="quick-actions" hidden aria-label="针对当前页面的快捷操作">
        <button type="button" data-action="explain">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9.5 9a2.6 2.6 0 1 1 4.3 2c-1 .7-1.8 1.2-1.8 2.5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
          <span>解释</span>
        </button>
        <button type="button" data-action="summarize">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h9M5 18h6"/></svg>
          <span>总结</span>
        </button>
        <button type="button" data-action="translate">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 8 6 6m-7 0 6-6 2-3M2 5h12M12 19l4-9 4 9m-6.5-3h5"/></svg>
          <span>翻译</span>
        </button>
      </section>

      <!-- The only primary scrolling region -->
      <main id="content" class="content">
        <div id="emptyState" class="empty-state">
          <div class="empty-visual" aria-hidden="true">
            <img src="assets/icon-128.png" alt="">
          </div>
          <h1>让当前页面成为上下文</h1>
          <p>读取屏幕内的文字，然后直接提问或使用快捷操作。</p>
          <button id="emptyCaptureButton" class="empty-capture-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h8M8 12h8M8 15h5"/></svg>
            <span id="emptyCaptureText">读取当前页面</span>
          </button>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="errorPanel" class="error-panel" hidden role="alert">
          <span id="errorText"></span>
          <button id="retryButton" type="button">重试</button>
        </div>
      </main>

      <!-- Fixed composer and model selector -->
      <footer class="composer-dock">
        <div class="composer-surface">
          <div class="composer">
            <textarea id="questionInput" rows="1" maxlength="4000" placeholder="询问当前页面…" disabled></textarea>
            <button id="actionButton" class="action-button" type="button" title="发送" aria-label="发送" disabled>
              <span class="action-icon action-icon-send" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m21 3-7.5 18-2.7-7.8L3 10.5 21 3Z"/><path d="m20 4-9.2 9.2"/></svg>
              </span>
              <span class="action-icon action-icon-stop" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
              </span>
            </button>
          </div>
          <div class="composer-meta">
            <div class="model-select-control">
              <span class="model-status-dot" aria-hidden="true"></span>
              <button id="modelPickerButton" class="model-picker-button" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>
                <span class="model-picker-provider">AI</span>
                <span id="modelPickerLabel" class="model-picker-label">未配置 AI 提供商</span>
              </button>
              <div id="modelPickerMenu" class="model-picker-menu" role="listbox" aria-label="可用模型" hidden></div>
              <select id="modelSelect" class="model-select-native" aria-label="选择当前模型" disabled>
                <option value="">未配置 AI 提供商</option>
              </select>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
            </div>
            <span id="statusText" role="status"></span>
            <span id="characterCount">0 / 4000</span>
          </div>
        </div>
      </footer>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
